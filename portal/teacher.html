<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Console — Kalaashaala</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/jpeg" href="../assets/img/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="portal.css" />
  <link rel="stylesheet" href="teacher.css" />
</head>
<body>

  <header class="p-header">
    <a class="brand" href="../index.html">
      <img src="../assets/img/logo.jpg" alt="" />
      <span><b>Kalaashaala</b><span>Teacher Console</span></span>
    </a>
    <div class="right">
      <a class="linkish" href="assignments.html">Assignments</a>
      <a class="linkish" href="students.html">Students</a>
      <a class="linkish" href="curriculum.html">Curriculum</a>
      <a class="linkish" href="app.html">Student view</a>
      <span id="whoami" class="muted" style="color:var(--gold-soft)"></span>
      <button class="linkish" id="signOut">Sign out</button>
    </div>
  </header>

  <main class="console console--single" id="main" hidden>

    <div class="picker">
      <label class="picker__field">
        <span>Batch</span>
        <select id="batchFilter" aria-label="Filter by batch">
          <option value="">All batches</option>
        </select>
      </label>
      <label class="picker__field picker__field--grow">
        <span>Student</span>
        <select id="studentPick" aria-label="Choose a student">
          <option value="">Choose a student…</option>
        </select>
      </label>
      <span class="muted" id="rosterCount"></span>
    </div>

    <!-- ============ Detail ============ -->
    <section class="detail" id="detail">
      <div class="card"><p class="empty">Choose a student from the list.</p></div>
    </section>

  </main>

  <div class="wrap" id="loading"><p class="muted">Loading…</p></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="teacher.js"></script>
</body>
</html>
