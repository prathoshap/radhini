<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignments — Kalaashaala</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/jpeg" href="../assets/img/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&family=Marcellus&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="portal.css" />
  <link rel="stylesheet" href="teacher.css" />
</head>
<body>

  <header class="p-header">
    <a class="brand" href="../index.html">
      <img src="../assets/img/logo.jpg" alt="" />
      <span><b>Kalaashaala</b><span>Assignments</span></span>
    </a>
    <div class="right">
      <a class="linkish" href="teacher.html">Progress</a>
      <a class="linkish" href="students.html">Students</a>
      <a class="linkish" href="curriculum.html">Curriculum</a>
      <button class="linkish" id="signOut">Sign out</button>
    </div>
  </header>

  <main class="console console--single" id="main" hidden>

    <div class="picker">
      <label class="picker__field">
        <span>Batch</span>
        <select id="batchPick" aria-label="Batch"></select>
      </label>
      <label class="picker__field">
        <span>Week</span>
        <select id="weekPick" aria-label="Week"></select>
      </label>
      <span class="muted" id="weekDates"></span>
    </div>

    <section id="detail">
      <div class="card"><p class="empty">Loading…</p></div>
    </section>

  </main>

  <div class="wrap" id="loading"><p class="muted">Loading…</p></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="assignments.js"></script>
</body>
</html>
